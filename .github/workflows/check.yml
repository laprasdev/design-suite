name: Check
# Every repository check, each a required status named after its npm script: `npm run check` (gate tools, types,
# size, circular imports, duplication), `npm test` and `npm run build`, which AGENTS.md asks for before every push,
# and the per-area type checks.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  npm:
    name: npm run ${{ matrix.script }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [check, test, build, 'check:graph', 'check:forms', 'check:sky', 'check:preview3d', 'check:gates']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # npm test reads Modal widths in Playwright's headless Chromium shell, kept between runs of one Playwright version.
      - if: matrix.script == 'test'
        id: playwright
        run: echo "version=$(node -p "require('./scripts/gateTools/package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - if: matrix.script == 'test'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npm run "$SCRIPT"
        env:
          SCRIPT: ${{ matrix.script }}
