name: Review
# Calls the code review in laprasdev/review-gate, whose README says when it runs and what it records. It is not a
# required check unless branch protection names its "claude review" status.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled]
    branches: [main]
permissions:
  contents: read
  pull-requests: read
  id-token: write
jobs:
  review:
    uses: laprasdev/review-gate/.github/workflows/review.yml@main
