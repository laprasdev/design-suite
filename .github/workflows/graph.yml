name: Graph contract
on:
  pull_request:
  push:
jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:graph
      - run: node --test tests/group-outlet-position.test.ts
